[package]
name = "nearlane-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nearlane-core.workspace = true
nearlane-service.workspace = true
nearlane-platform.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

# CXX-Qt requires generated unsafe FFI declarations. The exception is confined
# to this UI boundary; all non-UI crates inherit unsafe_code = forbid.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
