[workspace]
resolver = "2"
members = ["crypto_provider", "crypto_provider_default", "crypto_provider_rustcrypto", "ukey2_connections", "ukey2_proto", "ukey2_rs"]
default-members = ["ukey2_rs", "ukey2_connections"]

[workspace.dependencies]
aes = "0.8.3"
cbc = { version = "0.1.2", features = ["block-padding"] }
cfg-if = "1.0.0"
crypto_provider = { path = "crypto_provider" }
crypto_provider_default = { path = "crypto_provider_default" }
crypto_provider_rustcrypto = { path = "crypto_provider_rustcrypto", features = ["std"] }
ctr = "0.9.2"
ed25519-dalek = { version = "2.1.0", default-features = false }
hkdf = "0.12.3"
hmac = "0.12.1"
log = "0.4.20"
p256 = { version = "0.13.2", default-features = false }
protobuf = "=3.7.2"
rand = { version = "0.8.5", features = ["std", "std_rng"] }
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sec1 = "0.7.3"
sha2 = { version = "0.10.8", default-features = false }
subtle = { version = "2.5.0", default-features = false }
thiserror = { version = "2.0.4", default-features = false }
tinyvec = { version = "1.6.0", features = ["rustc_1_55"] }
ukey2_proto = { path = "ukey2_proto", default-features = false }
ukey2_rs = { path = "ukey2_rs" }
x25519-dalek = { version = "2.0.0", default-features = false }
