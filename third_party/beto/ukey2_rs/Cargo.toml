# Nearlane packaging manifest; original Rust sources are unchanged.
[package]
name = "ukey2_rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
build = false
autobenches = false
autotests = false

[dependencies]
crypto_provider = { workspace = true }
rand = { workspace = true }
ukey2_proto = { workspace = true }
log = { workspace = true }
num-bigint = "0.4.4"

[dev-dependencies]
crypto_provider_default = { workspace = true }
sha2 = { workspace = true }

[features]
default = []
test_rustcrypto = ["crypto_provider_default/rustcrypto"]
test_boringssl = ["crypto_provider_default/boringssl"]
