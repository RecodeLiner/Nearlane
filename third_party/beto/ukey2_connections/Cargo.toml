# Nearlane packaging manifest; original Rust sources are unchanged.
[package]
name = "ukey2_connections"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
build = false
autobenches = false
autotests = false

[dependencies]
ukey2_rs = { workspace = true }
crypto_provider = { workspace = true, features = ["alloc"] }
rand = { workspace = true, features = ["std", "std_rng"] }
ukey2_proto = { workspace = true }
nom = { version = "7.1.3", features = ["alloc"] }
bytes = "1.7.1"
thiserror = { workspace = true }

[dev-dependencies]
crypto_provider_default = { workspace = true }

[features]
default = []
test_boringssl = ["crypto_provider_default/boringssl"]
test_rustcrypto = ["crypto_provider_default/rustcrypto"]
