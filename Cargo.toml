[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nearlane-core = { path = "crates/core" }
nearlane-auth = { path = "crates/auth" }
nearlane-account = { path = "crates/account" }
nearlane-protocol = { path = "crates/protocol" }
nearlane-platform = { path = "crates/platform" }
nearlane-service = { path = "crates/service" }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
url = "2.5"
zeroize = "1.8"
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-build = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
