[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["third_party/beto"]
default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nearlane-core = { path = "crates/core" }
nearlane-auth = { path = "crates/auth" }
nearlane-account = { path = "crates/account" }
nearlane-protocol = { path = "crates/protocol" }
nearlane-platform = { path = "crates/platform" }
nearlane-service = { path = "crates/service" }
nearlane-application = { path = "crates/application" }
nearlane-transfer = { path = "crates/transfer" }
nearlane-certificates = { path = "crates/certificates" }
nearlane-discovery = { path = "crates/discovery" }
mdns-sd = "0.21"
if-addrs = "0.15"
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
libc = "0.2"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
tonic-prost = "0.14"
ukey2_connections = { path = "third_party/beto/ukey2_connections" }
crypto_provider_rustcrypto = { path = "third_party/beto/crypto_provider_rustcrypto", features = ["std"] }
prost = "0.14"
tempfile = "3.24"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
url = "2.5"
zeroize = "1.8"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
dirs = "6"
roxmltree = "0.21"
sys-locale = "0.3"
open = "5"
btleplug = "0.13.5"
uuid = "1"
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "renderer-femtovg", "accessibility", "compat-1-2", "system-tray"] }
slint-build = "=1.19.0"
rfd = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-build = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
